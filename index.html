<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>kty — dev harness</title>
    <style>
      body {
        margin: 0;
        background: #1a1a1a;
        color: #ddd;
        font:
          14px/1.5 system-ui,
          sans-serif;
      }
      #app {
        padding: 1.5rem;
      }
      canvas {
        width: 800px;
        max-width: 100%;
        aspect-ratio: 16/9;
        border-radius: 8px;
        box-shadow: 0 4px 24px #0008;
      }
      code {
        color: #58c4dd;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <h1>kty — Stage 3 render spike</h1>
      <p id="status">loading…</p>
      <canvas id="stage"></canvas>
    </div>
    <script type="module">
      import { VERSION, ThreeRenderer, Axes, Tex, DecimalNumber, Text } from './src/index.js';

      // Axes + numeric labels + a graph, plus Tex and a live DecimalNumber.
      const axes = new Axes({ xRange: [-4, 4, 1], yRange: [-2.5, 2.5, 1] });
      axes.addCoordinateLabels();
      const graph = axes.getGraph((x) => 0.4 * x * x - 1.5).setStroke('#FC6255', 4, 1);

      const title = new Tex('e^{i\\pi} + 1 = 0', { color: '#FFFFFF' }).scale(1.4).shift([0, 3, 0]);
      const label = new Text('f(x) = 0.4x^2', { color: '#58C4DD' }).scale(0.9).shift([4.6, 1.8, 0]);
      const counter = new DecimalNumber(0, { numDecimalPlaces: 2, color: '#FFFF00' })
        .scale(1.4)
        .shift([5.2, -1, 0]);

      const canvas = document.getElementById('stage');
      const renderer = new ThreeRenderer({ width: 1280, height: 720 }).attach(canvas);

      // Animate the counter with requestAnimationFrame.
      let t = 0;
      function frame() {
        t += 0.016;
        counter.setValue((Math.sin(t) * 0.5 + 0.5) * 100);
        renderer.render([axes, graph, title, label, counter]);
        requestAnimationFrame(frame);
      }
      frame();

      document.getElementById('status').innerHTML =
        `kty <code>v${VERSION}</code> — Axes + labels, a graph, <code>Tex</code>, ` +
        `<code>Text</code>, and a live <code>DecimalNumber</code> (MathJax glyphs → Three.js fills).`;
    </script>
  </body>
</html>
