<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>kty — dev harness</title>
    <style>
      body {
        margin: 0;
        background: #1a1a1a;
        color: #ddd;
        font:
          14px/1.5 system-ui,
          sans-serif;
      }
      #app {
        padding: 1.5rem;
      }
      canvas {
        width: 800px;
        max-width: 100%;
        aspect-ratio: 16/9;
        border-radius: 8px;
        box-shadow: 0 4px 24px #0008;
      }
      code {
        color: #58c4dd;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <h1>kty — Stage 3 render spike</h1>
      <p id="status">loading…</p>
      <canvas id="stage"></canvas>
    </div>
    <script type="module">
      import {
        VERSION,
        VGroup,
        ThreeRenderer,
        Circle,
        Square,
        Triangle,
        RegularPolygon,
        Arrow,
        Dot,
      } from './src/index.js';

      // Stage 4 geometry shapes, drawn via the native Three.js renderer.
      const circle = new Circle({ radius: 1.2, fillColor: '#58C4DD', fillOpacity: 1 }).shift([
        -4, 0, 0,
      ]);
      const square = new Square({ sideLength: 2, fillColor: '#FC6255', fillOpacity: 0.8 }).shift([
        -1.2, 0, 0,
      ]);
      const triangle = new Triangle({ fillColor: '#83C167', fillOpacity: 1 })
        .scale(1.3)
        .shift([1.6, 0, 0]);
      const pentagon = new RegularPolygon({ n: 5, strokeColor: '#FFFF00' }).shift([4, 0.6, 0]);
      const arrow = new Arrow({ start: [3, -1.6, 0], end: [5, -1.6, 0] });
      const dot = new Dot({ point: [-1.2, 0, 0], fillColor: '#FFFFFF' });

      const scene = new VGroup(circle, square, triangle, pentagon, arrow, dot);

      const canvas = document.getElementById('stage');
      const renderer = new ThreeRenderer({ width: 1280, height: 720 }).attach(canvas);
      renderer.render([scene]);

      document.getElementById('status').innerHTML =
        `kty <code>v${VERSION}</code> — Stage 4 geometry: Circle, Square, Triangle, ` +
        `RegularPolygon, Arrow, Dot (native <code>Line2</code> + <code>ShapeGeometry</code>).`;
    </script>
  </body>
</html>
